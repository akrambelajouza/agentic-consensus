[project]
name = "agentic-consensus"
version = "0.1.0"
description = "A three-agent LangGraph loop: a moderator frames a problem, Agent A proposes, Agent B critiques, until consensus."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2",
    "langchain-anthropic>=1.5",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["debugpy>=1.8", "langgraph-cli[inmem]>=0.4"]
openai = ["langchain-openai>=1.4"]
# OpenRouter speaks the OpenAI wire format, so it needs the same client.
openrouter = ["langchain-openai>=1.4"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
consensus = "agentic_consensus.__main__:main"
consensus-web = "agentic_consensus.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_consensus"]
